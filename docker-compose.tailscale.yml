# ManaBudget behind a Tailscale sidecar, served over HTTPS at
# https://manabudget.<your-tailnet>.ts.net (needed for GPS and PWA install).
#
#   1. In the Tailscale admin console: enable MagicDNS and HTTPS certificates.
#   2. Create an auth key (Settings → Keys) and put it in .env as TS_AUTHKEY=tskey-...
#   3. Set ORIGIN=https://manabudget.<your-tailnet>.ts.net in .env
#   4. docker compose -f docker-compose.tailscale.yml up -d
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: manabudget-tailscale
    hostname: manabudget
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      TS_HOSTNAME: manabudget
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: 'false'
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin

  manabudget:
    image: ghcr.io/seiko95/manabudget:latest
    container_name: manabudget
    restart: unless-stopped
    # Share the sidecar's network: the app is only reachable through Tailscale.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file:
      - path: .env
        required: false
    environment:
      ORIGIN: ${ORIGIN:?Set ORIGIN=https://manabudget.<tailnet>.ts.net in .env}
      TZ: ${TZ:-Europe/Paris}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-25M}
      TILE_URL: ${TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      GEOCODING_ENABLED: ${GEOCODING_ENABLED:-true}
      # Tailscale serve forwards the client address in X-Forwarded-For
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
    volumes:
      - ./data:/data
